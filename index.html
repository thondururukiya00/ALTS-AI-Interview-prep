<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTS Assessment Portal</title>
    <script>
        (function() {
            try {
                var activeEmail = localStorage.getItem("userEmail");
                if (activeEmail && activeEmail.trim()) {
                    window.location.replace("dashboard.html");
                } else {
                    window.location.replace("login.html");
                }
            } catch (e) {
                window.location.replace("login.html");
            }
        })();
    </script>
</head>
<body style="background: #090d16; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
        <p style="font-size: 15px; color: #94a3b8; font-weight: 500;">Directing to ALTS Assessment...</p>
    </div>
</body>
</html>
