<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Authentication & Login | ALTS Assessment</title>

    <!-- Immediate Auth Check: Existing logged-in user goes straight to dashboard -->
    <script>
        (function() {
            try {
                var activeEmail = localStorage.getItem("userEmail");
                if (activeEmail && activeEmail.trim()) {
                    window.location.replace("dashboard.html");
                }
            } catch (e) {}
        })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans (UI) & IBM Plex Mono (Code/Tabular Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Design Tokens & Login Stylesheet -->
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="login.css">

    <!-- Main Logic Script (Includes Auth Engine) -->
    <script src="script.js" defer></script>
    <!-- Supabase Cloud SDK & Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="theme.js"></script>
</head>

<body class="login-body">

    <!-- Top Navigation Bar -->
    <header class="login-topbar">
        <a href="login.html" class="login-brand" title="ALTS Assessment Portal">
            <div class="login-brand-icon">
                <i class="fa-solid fa-terminal"></i>
            </div>
            <span class="login-brand-title">ALTS Assessment</span>
        </a>

        <div class="login-top-actions">
            <button class="theme-toggle-btn" onclick="toggleAuthTheme()" id="loginThemeBtn" title="Toggle Theme" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon" id="loginThemeIcon"></i>
            </button>
        </div>
    </header>

    <!-- Central Authentication Card -->
    <main class="login-main">
        <div class="auth-card">

            <!-- Card Header -->
            <div class="auth-header">
                <span class="auth-badge">
                    <i class="fa-solid fa-shield-halved"></i> SECURE CANDIDATE PORTAL
                </span>
                <h1 id="formTitle">Welcome Back</h1>
                <p id="formSubtitle">Login to continue</p>
            </div>

            <!-- Dynamic Feedback Alert Message -->
            <div id="authMessage" class="auth-message"></div>

            <!-- Login / Signup Form -->
            <form id="loginForm" class="auth-form" novalidate autocomplete="on">

                <!-- Full Name Field (Displayed during Signup mode) -->
                <div class="form-group" id="nameBox" style="display: none;">
                    <label for="name">Full Name</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="name" name="name" class="auth-input" placeholder="e.g. Thonduru Rukiya" autocomplete="name">
                    </div>
                </div>

                <!-- Email Address Field -->
                <div class="form-group">
                    <label for="email">Institutional Email</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" class="auth-input" placeholder="candidate@alts.edu" autocomplete="email" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="auth-input" placeholder="Password" autocomplete="current-password" required>
                        <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword" title="Show/Hide Password"></i>
                    </div>
                </div>

                <!-- Confirm Password Field (Displayed during Signup mode) -->
                <div class="form-group" id="confirmPasswordBox" style="display: none;">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-shield-check input-icon"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="auth-input" placeholder="Confirm Password" autocomplete="new-password">
                        <i class="fa-solid fa-eye-slash toggle-password" id="toggleConfirmPassword" title="Show/Hide Password"></i>
                    </div>
                </div>

                <!-- Primary Submit Action -->
                <button type="submit" id="submitBtn" class="btn-auth-submit">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <!-- Mode Switcher (Login <-> Signup) -->
            <div class="auth-footer">
                <span id="authToggleText">New User? </span>
                <span id="authToggleLink" class="auth-toggle-link" onclick="toggleAuthMode()">Create Account</span>
            </div>

        </div>
    </main>

    <!-- Bottom Metadata Bar -->
    <footer class="login-footer-bar">
        <span>ALTS Autonomous Labor & Technical Assessment</span>
        <span>&bull;</span>
        <span>Engine v2026.4.1</span>
        <span>&bull;</span>
        <span>256-bit Secure Session</span>
    </footer>

</body>
</html>
